[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-vm"
version = "0.1.0"
description = "AST-based safety inspection for untrusted Python code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Aegis-VM Contributors" }]
keywords = ["security", "sandbox", "ast", "python", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ui = ["streamlit>=1.28"]

[project.scripts]
aegis-vm = "aegis_vm.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/aegis-vm"
Repository = "https://github.com/YOUR_USERNAME/aegis-vm"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis_vm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
